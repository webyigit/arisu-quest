<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F4F7">
<meta name="description" content="아리수 수질검사 방문지를 사진으로 접수하고 수도사업소별 동선과 완료 체크를 관리하는 일정 앱">
<title>아리수 퀘스트</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 레이아웃: 흰 카드를 한 줄로 쌓는 단일 컬럼. 색은 중립 회색 + 포인트 로즈 한 가지, 장식 없이 글자 크기·굵기로 위계를 만든다 */
:root{
  --bg:#F5F4F7; --bg2:#F0EEF3; --panel:#FFFFFF; --ink:#1E1B24; --muted:#6E6878; --faint:#9A94A3;
  --line:#E6E2EA; --accent:#E2558A; --accent-ink:#FFFFFF; --accent-soft:#FCE8F0;
  --water:#2F80C8; --ok:#1E9A72; --warn:#B26A00; --bad:#D23C55;
  --f-body:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-disp:var(--f-body); --f-pix:var(--f-body);
  --scale:1.1;
  /* 예전 이름 호환 */
  --taxi:var(--accent); --taxi-ink:var(--accent-ink); --pink:var(--accent); --chip:var(--bg2); --shadow:transparent;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121015; --bg2:#26222B; --panel:#1C1920; --ink:#F3F0F6; --muted:#ABA4B3; --faint:#7C7684;
  --line:#2F2B35; --accent:#F07AA5; --accent-ink:#1C1920; --accent-soft:#3A2330;
  --water:#7DB8EC; --ok:#5BD3A6; --warn:#F2B35B; --bad:#FF7F93; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121015; --bg2:#26222B; --panel:#1C1920; --ink:#F3F0F6; --muted:#ABA4B3; --faint:#7C7684;
  --line:#2F2B35; --accent:#F07AA5; --accent-ink:#1C1920; --accent-soft:#3A2330;
  --water:#7DB8EC; --ok:#5BD3A6; --warn:#F2B35B; --bad:#FF7F93; color-scheme:dark}

html{font-size:calc(16px * var(--scale));padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.55;min-height:100%;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--water);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:40rem;margin:0 auto;padding:0 16px 5rem;display:flex;flex-direction:column;gap:.75rem}

/* 카드 */
.px{background:var(--panel);border-radius:16px;padding:1.1rem}
.px-h{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin:0 0 .8rem}
.px-h h2{font-size:1.1rem;font-weight:700;margin:0;line-height:1.3}
.tag{display:none}
.muted{color:var(--muted)} .small{font-size:.85rem} .need{color:var(--warn);font-weight:600}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.src{font-size:.78rem;color:var(--faint);margin-top:.7rem}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;border:0;border-radius:12px;background:var(--bg2);color:var(--ink);
  padding:.6rem 1rem;font-weight:600;cursor:pointer;min-height:2.75rem;text-decoration:none;transition:background .15s}
.btn:hover{background:color-mix(in srgb,var(--bg2) 80%,var(--ink) 8%)}
.btn:active{transform:scale(.98)}
.btn.y,.btn.b{background:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:2.3rem;padding:.35rem .75rem;font-size:.88rem;border-radius:10px}
.btn.ghost{background:transparent;color:var(--muted)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.ic{width:2.2rem;height:2.2rem;min-height:0;padding:0;background:transparent;color:var(--muted);font-size:.85rem;font-weight:700}

/* 상단바 */
.hud{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:calc(.6rem + env(safe-area-inset-top,0px)) 16px .6rem;margin-bottom:.25rem}
.hud-in{max-width:40rem;margin:0 auto;display:flex;flex-direction:column;gap:.45rem}
.hud-top{display:flex;align-items:center;gap:.25rem;flex-wrap:wrap}
.logo{font-size:1.1rem;font-weight:800;display:flex;align-items:center;gap:.4rem;white-space:nowrap;margin-right:auto}
.logo .ari-s{width:1.6rem;height:auto}
.tools{display:flex;gap:0}
.btn.addq{font-size:.9rem;padding:.4rem .9rem;min-height:2.4rem}
.exp{display:grid;grid-template-columns:auto 1fr auto auto;gap:.6rem;align-items:center;font-size:.75rem;font-weight:600;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.bar b{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);border-radius:99px;transition:width .4s ease}
.coins{color:var(--accent)}

/* 아리 한마디: 작게 한 줄 */
.ari-card{display:flex;gap:.7rem;align-items:center;padding:.75rem 1rem}
.ari-btn{background:none;border:0;padding:0;cursor:pointer;width:2.8rem;flex:none}
.ari-btn svg{width:100%;height:auto;display:block}
.bubble{font-size:.95rem;line-height:1.45;min-width:0;color:var(--ink)}
.bubble small{display:block;font-size:.8rem;color:var(--muted)}
.ari-jump{animation:jump .5s ease}
@keyframes jump{40%{transform:translateY(-8px)}}
.heart{position:fixed;pointer-events:none;color:var(--accent);font-size:1.1rem;z-index:56}

/* 날짜 */
.date-nav{display:grid;grid-template-columns:auto 1fr auto;gap:.5rem;align-items:center}
.date-nav .mid{text-align:center}
.date-big{font-size:1.35rem;font-weight:800;line-height:1.2}
.date-nav input,textarea,.inp{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:.45rem .6rem}
.date-nav input{font-size:.88rem}
textarea,.inp{width:100%;min-height:2.75rem}
textarea{min-height:6rem;resize:vertical}

/* 수질 기준 */
.std{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.gauge{background:var(--bg);border-radius:12px;padding:.7rem .75rem;display:flex;flex-direction:column;gap:.1rem;min-width:0}
.gauge .k{font-size:.8rem;color:var(--muted);font-weight:600}
.gauge .v{font-size:1.1rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3}
.gauge .u{font-size:.75rem;color:var(--faint)}

/* 접수 */
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:1.4rem 1rem;text-align:center;background:var(--bg);cursor:pointer;display:flex;flex-direction:column;gap:.3rem;align-items:center}
.drop strong{font-size:1.05rem;font-weight:700}
.thumbs{display:flex;gap:.4rem;flex-wrap:wrap}
.thumbs img{width:4rem;height:4rem;object-fit:cover;border-radius:10px}
.ai-out{font-size:.8rem;color:var(--muted);white-space:pre-wrap;word-break:break-all}
details summary{cursor:pointer;font-weight:600;padding:.35rem 0;color:var(--muted)}

.count{font-size:.9rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.route-ctl{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.6rem 0 .3rem}
/* 필터 */
.fbar{display:flex;flex-direction:column;gap:.45rem;margin:.2rem 0 .4rem}
.frow{display:flex;flex-wrap:wrap;gap:.35rem}
.frow.end{justify-content:flex-end}
.fchip{border:0;background:var(--bg2);color:var(--muted);border-radius:99px;padding:.3rem .8rem;font-size:.85rem;font-weight:600;cursor:pointer;min-height:2.1rem}
.fchip.on{background:var(--ink);color:var(--panel)}
.fchip.ghost{background:transparent;padding-inline:.3rem;text-decoration:underline;text-underline-offset:3px}

/* 동선 목록 */
.office{margin-top:.6rem}
.office-h{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;width:100%;border:0;background:none;color:var(--ink);cursor:pointer;text-align:left;padding:.3rem 0;font-size:.95rem;font-weight:700}
.office-h .sw{width:.55rem;height:.55rem;border-radius:50%;display:inline-block}
.office-h .cnt{font-size:.8rem;color:var(--faint);font-weight:600}
.office-h .caret{margin-left:auto;color:var(--faint);font-size:.8rem}
.list{display:flex;flex-direction:column;list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.stop{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:.6rem;padding:.55rem .1rem;border-bottom:1px solid var(--line);min-width:0}
.chk{appearance:none;-webkit-appearance:none;width:1.5rem;height:1.5rem;border:2px solid var(--faint);border-radius:50%;background:transparent;cursor:pointer;display:grid;place-items:center;margin:0 .35rem}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:"";width:.55rem;height:.3rem;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.stop .sum{display:flex;align-items:center;gap:.6rem;min-width:0;width:100%;border:0;background:none;color:var(--ink);text-align:left;cursor:pointer;padding:0;min-height:2.6rem}
.num{font-size:.8rem;color:var(--faint);font-variant-numeric:tabular-nums;flex:none;width:1.4rem}
.stop .tx{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.nm{font-size:1rem;font-weight:600}
.stop .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop .mini{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop .eta{flex:none;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stop .eta.q{color:var(--warn)}
.stop .caret{flex:none;color:var(--faint);font-size:.75rem}
.stop.done .nm{text-decoration:line-through;color:var(--faint)}
.stop.done .mini,.stop.done .eta{color:var(--faint)}
.stop .detail{grid-column:1/-1;display:flex;flex-direction:column;gap:.5rem;background:var(--bg);border-radius:12px;padding:.8rem;margin:.1rem 0 .3rem}
.leg{display:flex;flex-wrap:wrap;gap:.25rem .8rem;align-items:center;font-size:.85rem;color:var(--muted)}
.leg b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.leg a{font-weight:600}
.addr{font-size:.92rem;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:.3rem}
.chip{font-size:.78rem;font-weight:600;padding:.15rem .55rem;border-radius:99px;background:var(--panel);color:var(--muted)}
.chip.of{background:var(--accent-soft);color:var(--accent)}
.chip.q{color:var(--warn);background:transparent;border:1px dashed currentColor}
.note{font-size:.85rem;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:.35rem}
.acts .btn{background:var(--panel)}
.meas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem;margin-top:.3rem}
.meas label{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:.15rem}
.meas input{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:.3rem .4rem;width:100%;font-variant-numeric:tabular-nums}
.meas input.bad{border-color:var(--bad);color:var(--bad)} .meas input.ok{border-color:var(--ok)}
.stamp{display:none}
.empty{text-align:center;padding:1.2rem .5rem;display:flex;flex-direction:column;gap:.5rem;align-items:center}
.example-flag{font-size:.7rem;background:var(--bg2);color:var(--muted);padding:.1rem .4rem;border-radius:6px}

/* 대화창·시트 */
.ov{position:fixed;inset:0;z-index:50;background:rgba(20,16,24,.45);display:grid;place-items:center;padding:16px}
.term,.sheet{width:min(30rem,100%);max-height:90vh;overflow:auto;background:var(--panel);color:var(--ink);border-radius:20px;padding:1.3rem;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.sheet{width:min(34rem,100%);display:flex;flex-direction:column;gap:.8rem}
.term .t-h{display:none}
.term .t-ari{width:3.4rem;margin:0 auto .5rem;display:block}
.term .typed{font-size:1.05rem;line-height:1.6;text-align:center;white-space:pre-wrap;min-height:0}
.term .typed::after{content:""}
.term .opts{display:flex;flex-direction:column;gap:.45rem;margin-top:1rem}
.term .opt{border:0;border-radius:12px;background:var(--bg2);color:var(--ink);padding:.7rem 1rem;font-weight:600;cursor:pointer;text-align:center;min-height:2.75rem}
.term .opt:hover,.term .opt:focus-visible{background:var(--accent-soft)}
.term .inp{font-family:var(--f-body)}
.term label.small{color:var(--muted)!important;font-weight:600}
.sheet label{display:flex;flex-direction:column;gap:.25rem;font-weight:600;font-size:.9rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media (max-width:440px){.grid2{grid-template-columns:1fr}.gauge{padding:.6rem}.gauge .v{font-size:1rem}}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;margin-bottom:1rem;background:var(--bg2);border-radius:12px;padding:4px}
.auth-tab{background:transparent;border:0;color:var(--muted);font-weight:600;padding:.5rem;cursor:pointer;min-height:2.5rem;border-radius:9px}
.auth-tab.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.auth-go{background:var(--accent)!important;color:var(--accent-ink)!important}
.auth-link{background:transparent;border:0;color:var(--water);text-decoration:underline;font-size:.9rem;padding:.5rem;cursor:pointer;min-height:2.6rem}
#au-msg{color:var(--bad)!important}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--panel);padding:.65rem 1.1rem;border-radius:12px;font-weight:600;font-size:.9rem;max-width:calc(100% - 32px)}
.fx{position:fixed;inset:0;pointer-events:none;z-index:55}
.clear-banner{font-size:1.4rem;font-weight:800;color:var(--accent);text-align:center}
.warnbox{background:color-mix(in srgb,var(--bad) 10%,var(--panel));display:flex;flex-direction:column;gap:.2rem}
.warnbox strong{color:var(--bad)}
.sharedbox{display:flex;flex-direction:column;gap:.2rem}
.sharedbox strong{color:var(--water)}
#intakePage{padding-top:.25rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="hud">
  <div class="hud-in">
    <div class="hud-top">
      <div class="logo"><span id="logoAri" aria-hidden="true"></span>아리수 퀘스트</div>
      <button class="btn y addq" id="intakeBtn" aria-label="의뢰 접수(목록 올리기)">＋ 접수</button>
    </div>
    <div class="exp"><span id="lv">LV 1</span><div class="bar" aria-label="오늘 진행률"><b id="expBar"></b></div><span><span class="coins">●</span> <span id="coins">0</span></span>
<div class="tools">
        <button class="btn ic" id="fontDown" aria-label="글씨 작게">A-</button>
        <button class="btn ic" id="fontUp" aria-label="글씨 크게">A+</button>
        <button class="btn ic" id="themeBtn" aria-label="다크/라이트 전환">☾</button>
        <button class="btn ic" id="setBtn" aria-label="설정">⚙</button>
      </div></div>
  </div>
</header>

<main class="wrap" id="app">
  <div class="px warnbox" id="limitBanner" role="alert" hidden></div>
  <div class="px sharedbox" id="sharedBanner" hidden></div>
  <section class="px ari-card" aria-label="아리의 한마디">
    <button class="ari-btn" id="ariBtn" type="button" aria-label="아리 쓰다듬기"></button>
    <div class="bubble" id="ariSay" aria-live="polite">안녕! 나는 물방울 아리야.</div>
  </section>
  <section class="px" aria-label="날짜">
    <div class="date-nav">
      <button class="btn sm" id="prevDay" aria-label="이전 날">◀</button>
      <div class="mid"><div class="date-big" id="dateLabel">-</div>
        <div class="small muted" id="dateSub">-</div></div>
      <button class="btn sm" id="nextDay" aria-label="다음 날">▶</button>
    </div>
    <div class="row" style="justify-content:center;margin-top:.6rem">
      <input type="date" id="datePick" aria-label="날짜 선택">
      <button class="btn sm" id="todayBtn">오늘</button>
      <button class="btn sm" id="shareBtn">공유</button>
    </div>
  </section>

  <section class="px" aria-label="수질 기준">
    <div class="px-h"><h2>오늘의 수질 기준</h2><span class="tag">WATER STD</span></div>
    <div class="std" id="stdBox"></div>
    <p class="src" style="margin:.7rem 0 0">기준: 환경부 먹는물 수질기준 (<a href="https://news.seoul.go.kr/env/?p=565125" target="_blank" rel="noopener">서울시 환경 누리집</a>). 실제 측정값은 <a href="https://arisu.seoul.go.kr/arisumap/" target="_blank" rel="noopener">아리수맵</a>에서 볼 수 있어요.</p>
  </section>


  <section class="px" aria-label="오늘의 동선">
    <div class="px-h"><h2>오늘의 동선</h2><span class="count" id="questCount">0 / 0</span></div>
    <div class="small muted" id="startLabel">출발지: 설정에서 지정 (없으면 첫 장소부터)</div>
    <div class="route-ctl">
      <button class="btn y" id="routeBtn">동선 짜기</button>
      <button class="btn" id="fillBtn">위치 찾기</button>
    </div>
    <div id="routeOut"></div>
    <p class="src">소요시간은 직선거리로 계산한 추정치예요. 정확한 시간은 장소를 펼쳐 길찾기에서 확인하세요.</p>
    <div class="row" style="justify-content:center"><button class="btn sm ghost" id="clearDay">이 날 목록 비우기</button></div>
  </section>
</main>
<main class="wrap" id="intakePage" hidden>
  <div class="row"><button class="btn sm" id="intakeBack">◀ 돌아가기</button></div>
  <section class="px" aria-label="의뢰 접수" id="intake">
    <div class="px-h"><h2>의뢰 접수</h2><span class="tag" id="intakeDate">NEW QUEST</span></div>
    <label class="drop" id="drop" for="photo">
      <strong>방문 목록 사진 올리기</strong>
      <span class="small muted">촬영하거나 갤러리에서 고르면 휴대폰 안에서 글자를 읽어 목록으로 만들어요 (무료)</span>
      <input type="file" id="photo" accept="image/*" multiple hidden>
    </label>
    <div class="thumbs" id="thumbs"></div>
    <div class="row" style="margin-top:.6rem">
      <button class="btn y" id="ocrBtn" disabled>사진 글자 읽기</button>
    </div>
    <div class="ai-out" id="aiOut" aria-live="polite"></div>
    <details style="margin-top:.4rem">
      <summary>글로 붙여넣기 / 직접 추가</summary>
      <div style="display:flex;flex-direction:column;gap:.5rem;margin-top:.4rem">
        <textarea id="pasteBox" placeholder="예) 화곡동 OO아파트 관리사무소 / 서울 강서구 ..."></textarea>
        <div class="row"><button class="btn b" id="parseBtn">글에서 목록 만들기</button>
        <button class="btn" id="manualBtn">한 곳 직접 추가</button></div>
      </div>
    </details>
  </section>
</main>

<div class="fx" id="fx" aria-hidden="true"></div>
<div id="layer"></div>


<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
