name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          mkdir -p _site
          cp index.html app.js manifest.webmanifest icon.svg _site/
          sed -i "s#src=\"app.js\"#src=\"app.js?v=${GITHUB_SHA::7}\"#; s#src=\"config.js\"#src=\"config.js?v=${GITHUB_SHA::7}\"#" _site/index.html
          printf 'window.ARISU_CONFIG={url:%s,key:%s};\n' "\"$SUPABASE_URL\"" "\"$SUPABASE_PUBLISHABLE_KEY\"" > _site/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
